[package]
name = "poolproof"
version = "0.1.0"
edition = "2024"
description = "Find out what breaks when you put a connection pooler in front of Postgres"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nihal-Pandey-2302/poolproof"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
pg_query = "18.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
toml = "1.1.8"
