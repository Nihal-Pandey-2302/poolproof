[package]
name = "poolproof"
version = "0.1.0"
edition = "2024"
description = "Find out what breaks when you put a connection pooler in front of Postgres"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nihal-Pandey-2302/poolproof"
readme = "README.md"
rust-version = "1.88"
keywords = ["postgres", "pgbouncer", "connection-pool", "testing", "pooler"]
categories = ["command-line-utilities", "database", "development-tools::testing"]
# The test bed and CI files are for this repo, not for `cargo install`. results/ stays,
# drivers results too: `scan --pooler` reads them. Of drivers/, the binary only needs
# drivers.toml and cases.toml.
exclude = [".github/", "action.yml", ".gitguardian.yaml", ".taplo.toml", "docker/", "drivers/*/", "drivers/docker-bake.hcl", "drivers/targets.txt", "fuzz/", "scripts/", "selftest/", "tools/", "DRIVERS.md", "RESULTS.md", "results/known-flaky.txt", "results/variants-*.json", "targets.toml", "targets-variants.toml"]

# cargo binstall poolproof: download the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
csv = "1.4.0"
fallible-iterator = "0.2.0"
pg_query = "18.1.0"
postgres-protocol = "0.6.12"
# TLS on ring, not aws-lc-rs: aws-lc-sys needs cmake and nasm, which makes the
# cross-platform release builds harder.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Already in the tree through tokio; sets the URL's keepalive and timeout options on our
# own sockets. "all" has the keepalive interval, retries and tcp_user_timeout.
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"

[build-dependencies]
# Already a dependency; build.rs reads the drivers reports with it.
serde_json = "1.0.154"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
schemars = "1.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# panic stays unwind: a panic in a spawned task must reach the runner as a JoinError and
# become a recorded outcome, not abort the whole run.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
# Set by cargo-fuzz for the targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
