[package]
name = "poolproof"
version = "0.1.0"
edition = "2024"
description = "Find out what breaks when you put a connection pooler in front of Postgres"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nihal-Pandey-2302/poolproof"
readme = "README.md"
rust-version = "1.88"
keywords = ["postgres", "pgbouncer", "connection-pool", "testing", "pooler"]
categories = ["command-line-utilities", "database", "development-tools::testing"]
# The test bed and CI files are for this repo, not for `cargo install`. results/ stays:
# `scan --pooler` reads it.
exclude = [".github/", "docker/", "scripts/", "RESULTS.md", "targets.toml"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
fallible-iterator = "0.2.0"
pg_query = "18.1.0"
postgres-protocol = "0.6.12"
# TLS on ring, not aws-lc-rs: aws-lc-sys needs cmake and nasm, which makes the
# cross-platform release builds harder.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already in the tree through tokio; used for TCP keepalives on our own sockets.
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[lints.rust]
# Set by cargo-fuzz for the targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
