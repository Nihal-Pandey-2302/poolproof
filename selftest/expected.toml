# Expected verdicts for the self-test targets (tools/pp-proxy). Checked with
#   pp-selftest-check selftest/expected.toml report.json scenarios
# Any other verdict is a harness bug, a scenario bug or a proxy bug, and fails CI.
#
# Values: pass | silent | error | hang | harness-error | skip, or a table with
# `result`, optional `reason_prefix` (matched with starts_with; harness-error and skip
# rows only, the results that have a reason) and `why`.
# Every target has `default = "pass"`, so a new scenario that a fault breaks has to be
# listed here, which keeps each fault's effect narrow and explained.

# One server connection per client, bytes copied unchanged. Anything but PASS means
# the harness or the scenario is wrong.
[targets.selftest-passthrough]
default = "pass"
protocol-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
set-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
sql-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
temp-table-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }

# Drops client messages sent after a Sync until that Sync's ReadyForQuery.
[targets.selftest-drop-pipelined]
default = "pass"
protocol-four-pipelined-requests = { result = "hang", why = "requests 2-4 never reach the server" }
protocol-pipeline-recovers-after-error = { result = "hang", why = "the second request never reaches the server" }
# protocol-pipelined-statements passes: its steps have a single Sync each.
protocol-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
set-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
sql-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
temp-table-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }

# Drops every ErrorResponse after startup. Every scenario where Postgres answers with
# an error fails; the client gets ReadyForQuery and no hint, so they are silent, except
# where the error was the only reply.
[targets.selftest-swallow-error]
default = "pass"
aborted-transaction-not-reused = { result = "silent", why = "57014 from the statement timeout is dropped" }
cancel-reaches-running-query = { result = "silent", why = "57014 from the cancel is dropped" }
cancel-under-saturated-pool = { result = "silent", why = "57014 from the cancel is dropped" }
cursor-isolated-between-clients = { result = "silent", why = "the other client's 34000 is dropped" }
discard-all-in-transaction-fails = { result = "silent", why = "25001 is dropped" }
multi-statement-begin-error = { result = "silent", why = "42P01 inside BEGIN; ...; COMMIT is dropped" }
multi-statement-begin-variants = { result = "silent", why = "25006 from the INSERT in a READ ONLY transaction is dropped" }
multi-statement-error-aborts-transaction = { result = "silent", why = "42P01 that aborts the transaction is dropped" }
prepare-in-aborted-transaction = { result = "silent", why = "22012 that aborts the transaction is dropped" }
protocol-error-after-flush = { result = "hang", why = "42601 is dropped; with Flush nothing else comes back" }
protocol-multi-statement-transaction = { result = "silent", why = "42601 for the multi-statement Parse is dropped" }
protocol-pipeline-recovers-after-error = { result = "silent", why = "22012 is dropped" }
sql-prepare-isolated-between-clients = { result = "silent", why = "the other client's 26000 is dropped" }
temp-table-isolated-between-clients = { result = "silent", why = "the other client's 42P01 is dropped" }
protocol-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
set-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
sql-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
temp-table-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }

# Drops the client's CopyDone, so the server waits for more data.
[targets.selftest-no-copydone]
default = "pass"
copy-from-stdin = { result = "hang", why = "COPY never completes" }
protocol-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
set-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
sql-prepare-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }
temp-table-survives-server-change = { result = "skip", reason_prefix = "precondition at step", why = "every client has its own server connection, so c never holds a's" }

# Reports one row more in every INSERT command tag.
[targets.selftest-wrong-tag]
default = "pass"
multi-statement-begin = { result = "silent", why = "INSERT tag says 2 rows" }
protocol-prepare-survives-server-change = { result = "silent", why = "the INSERT that records a's backend gets a tag saying 2 rows" }
set-survives-server-change = { result = "silent", why = "the INSERT that records a's backend gets a tag saying 2 rows" }
sql-prepare-survives-server-change = { result = "silent", why = "the INSERT that records a's backend gets a tag saying 2 rows" }
temp-table-survives-server-change = { result = "silent", why = "the INSERT that records a's backend gets a tag saying 2 rows" }
multi-statement-begin-left-open = { result = "silent", why = "INSERT tag says 2 rows" }
multi-statement-begin-not-first = { result = "silent", why = "INSERT tag says 2 rows" }
multi-statement-begin-variants = { result = "silent", why = "INSERT tag says 2 rows" }
multi-statement-commit-first = { result = "silent", why = "INSERT tag says 2 rows" }
protocol-multi-statement-transaction = { result = "silent", why = "INSERT tag says 2 rows" }

# One server connection for all clients, no reset, every client gets its
# BackendKeyData. Fails the documented transaction-pooling limits like PgBouncer, plus
# cancel routing (pgdog#1505 class) and a blocked pool behind an abandoned query.
[targets.selftest-shared-server]
default = "pass"
abandoned-query-does-not-block-pool = { result = "hang", why = "the server stays busy until pg_sleep ends" }
aborted-transaction-not-reused = { result = "error", why = "the next client inherits the aborted transaction (25P02)" }
advisory-lock-released-on-disconnect = { result = "silent", why = "the lock stays on the shared session" }
cancel-from-idle-client-is-harmless = { result = "error", why = "both clients share one cancel key, so the idle client cancels the other's query" }
cursor-isolated-between-clients = { result = "silent", why = "the WITH HOLD cursor is visible to the other client" }
deallocate-all-isolated = { result = "error", why = "the other client's DEALLOCATE ALL drops the statement (26000)" }
empty-search-path-from-set-config = { result = "silent", why = "set_config leaks to the next client" }
listen-notify-delivered = { result = "silent", why = "the notification arrives while no client holds the server" }
load-isolated-between-clients = { result = "silent", why = "the loaded library is visible to the other client" }
protocol-statement-names-isolated = { result = "error", why = "the second Parse of s1 gets 42P05" }
protocol-unnamed-statement-survives-other-clients = { result = "error", why = "the other client's query replaces the unnamed statement (26000)" }
search-path-isolated-between-clients = { result = "silent", why = "SET search_path leaks" }
set-does-not-leak-after-disconnect = { result = "silent", why = "SET survives the disconnect" }
set-isolated-between-clients = { result = "silent", why = "SET leaks" }
set-role-isolated-between-clients = { result = "silent", why = "SET ROLE leaks" }
set-role-reset-after-pinned-disconnect = { result = "silent", why = "SET ROLE survives the disconnect" }
sql-prepare-isolated-between-clients = { result = "silent", why = "the SQL PREPARE is visible to the other client" }
temp-table-isolated-between-clients = { result = "silent", why = "the temp table is visible to the other client" }
protocol-prepare-survives-server-change = { result = "skip", reason_prefix = "needs several server connections", why = "one server connection, so a can't move to another" }
set-survives-server-change = { result = "skip", reason_prefix = "needs several server connections", why = "one server connection, so a can't move to another" }
sql-prepare-survives-server-change = { result = "skip", reason_prefix = "needs several server connections", why = "one server connection, so a can't move to another" }
temp-table-survives-server-change = { result = "skip", reason_prefix = "needs several server connections", why = "one server connection, so a can't move to another" }

# Two server connections, last in, first out, never reset. Its probes see several
# connections (idle shared, busy separate), so the scenarios that need one SKIP. The
# rest match shared-server: with no reset, a client that runs after another one lands
# on that one's released connection, the top of the free stack. Any row that differs
# from shared-server names the slot order that makes it differ.
# Scenarios that check state left on a reused server connection must FAIL here, or
# SKIP because the reuse was never reached; never PASS. A PASS would mean the client
# got its own connection back and the scenario tested nothing.
[targets.selftest-pool-of-two]
default = "pass"
abandoned-query-does-not-block-pool = { result = "skip", reason_prefix = "needs one server connection", why = "the probes saw several server connections" }
aborted-transaction-not-reused = { result = "error", why = "the next client gets the released connection, still in the aborted transaction (25P02)" }
advisory-lock-released-on-disconnect = { result = "silent", why = "the lock stays on the released connection's session" }
cancel-from-idle-client-is-harmless = { result = "error", why = "a's key is the top free slot at its startup, the slot b then takes, so a cancels b's query" }
cancel-reaches-running-query = { result = "pass", why = "a lone client's key is the top free slot at startup, which its query then gets" }
cancel-under-saturated-pool = { result = "skip", reason_prefix = "needs one server connection", why = "the probes saw several server connections" }
cursor-isolated-between-clients = { result = "silent", why = "b gets a's released connection, with the WITH HOLD cursor" }
deallocate-all-isolated = { result = "error", why = "b's DEALLOCATE ALL runs on a's released connection (26000)" }
empty-search-path-from-set-config = { result = "silent", why = "set_config leaks to the next client on the same connection" }
listen-notify-delivered = { result = "silent", why = "the notification arrives while no client holds the connection" }
load-isolated-between-clients = { result = "silent", why = "b gets a's released connection, with the loaded library" }
protocol-statement-names-isolated = { result = "error", why = "b's Parse of s1 runs on a's released connection (42P05)" }
protocol-unnamed-statement-survives-other-clients = { result = "error", why = "b's query on a's released connection replaces the unnamed statement (26000)" }
search-path-isolated-between-clients = { result = "silent", why = "SET search_path leaks through the released connection" }
set-does-not-leak-after-disconnect = { result = "silent", why = "SET survives the disconnect on the released connection" }
set-isolated-between-clients = { result = "silent", why = "SET leaks through the released connection" }
set-role-isolated-between-clients = { result = "silent", why = "SET ROLE leaks through the released connection" }
set-role-reset-after-pinned-disconnect = { result = "silent", why = "SET ROLE survives the disconnect on the released connection" }
sql-prepare-isolated-between-clients = { result = "silent", why = "b gets a's released connection, with the SQL PREPARE" }
temp-table-isolated-between-clients = { result = "silent", why = "b gets a's released connection, with the temp table" }

# Accepts and closes. Preflight marks every scenario ERROR; nothing may pass.
[targets.selftest-refuse]
default = { result = "harness-error", reason_prefix = "target unreachable: pooler:" }
