# PgBouncer 1.26.1 on Postgres 18 passes this one, so the second entry stops there: its
# config docs list "`search_path` (since PostgreSQL version 18)" among the parameters it
# tracks by default (track_extra_parameters, doc/config.md at pgbouncer_1_26_1, commit
# f03e9bf263d7ccd5d1d152a61811bf3258dd6b87; 1.25.2's list doesn't have it), and the
# committed results agree. Postgres 17 and older PgBouncer versions fail it.

[[limitation]]
scenario = "search-path-isolated-between-clients"
mode = "transaction"
config = ["default", "tls"]
since = "1.24.1"
fixed_in = "1.26.1"
differs = [{ step = 7, pooler = { status = "ok", rows = [["public"]], tags = [0] } }]
doc = "https://github.com/pgbouncer/pgbouncer.github.io/blob/ccb120f859a47fe3a6f3b2120d16194fd11f562f/features.md#sql-feature-map-for-pooling-modes"
quote = "SET/RESET | Yes | Never"
note = "Row of the table \"SQL feature map for pooling modes\" (columns: Feature, Session pooling, Transaction pooling), with the table's padding spaces collapsed."

