# PgBouncer's documented limitations: FAILs its own docs say happen. A result that
# matches an entry exactly is reported as expected, still a FAIL; anything else stays
# a bug. See README "Documented limitations" for the format and the rules.
#
# Every quote is a row of the feature map in features.md at ccb120f (the newest change to
# that file as of 2026-11-01). Not covered by it, so left as FAILs: an empty search_path
# set with set_config() coming back as public (empty-search-path-from-set-config; on
# Postgres 18 with PgBouncer 1.26 the error from pgbouncer#1663), and the unnamed
# protocol statement lost when another client runs in between
# (protocol-unnamed-statement-survives-other-clients; the map says protocol-level
# prepared plans work with max_prepared_statements, and says nothing about the unnamed
# one).

# Session state the feature map lists as "Never" for transaction pooling: the next client on
# the same server connection sees it, or the client that set it loses it.

[[limitation]]
scenario = "set-isolated-between-clients"
mode = "transaction"
config = ["default", "tls"]
since = "1.24.1"
differs = [{ step = 7, pooler = { status = "ok", rows = [["9MB"]], tags = [0] } }]
doc = "https://github.com/pgbouncer/pgbouncer.github.io/blob/ccb120f859a47fe3a6f3b2120d16194fd11f562f/features.md#sql-feature-map-for-pooling-modes"
quote = "SET/RESET | Yes | Never"
note = "Row of the table \"SQL feature map for pooling modes\" (columns: Feature, Session pooling, Transaction pooling), with the table's padding spaces collapsed."

