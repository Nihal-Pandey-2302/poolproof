# Supavisor's documented limitations: FAILs its own docs say happen. A result that matches
# an entry exactly is reported as expected, still a FAIL; anything else stays a bug. See
# docs/limitations.md for the format and the rules.
#
# Supavisor's docs (docs/ at v2.9.13 and v2.10.0-rc.1) say its transaction mode behaves the
# same as PgBouncer's (migrating/pgbouncer.md). An entry here uses that only where
# PgBouncer's own feature map documents the scenario (see pgbouncer.toml) and Supavisor
# fails exactly the same steps the same way.
#
# Left as FAILs, because the docs don't say them or they are reported upstream:
# - named protocol statements between clients (protocol-statement-names-isolated): the FAQ
#   says they are unsupported in transaction mode (2.9.13) or need the
#   named_prepared_statements flag (2.10.0-rc.1), but not that client b's Bind silently
#   runs client a's statement, which is reported upstream;
# - the server connection beyond pool_size (pool_size 1 is not a hard cap), and with it the
#   *-survives-server-change and *-survives-own-transactions scenarios on the default
#   config; protocol-prepare-survives-server-change is one of them;
# - the unnamed protocol statement lost when another client runs in between
#   (protocol-unnamed-statement-survives-other-clients) and DEALLOCATE ALL
#   (deallocate-all-isolated): the FAQ speaks of named statements only;
# - empty-search-path-from-set-config, the pipeline hangs on 2.9.13, and everything on the
#   strict config (txn_mode_leak_action = error), which rejects instead of leaking.

# Session state PgBouncer's feature map lists as "Never" for transaction pooling, through
# migrating/pgbouncer.md (the same text at v2.9.13). Steps and outcomes are the same as
# PgBouncer's entries. Unlike PgBouncer 1.26.1, Supavisor also fails search_path on
# Postgres 18, so that entry has no Postgres bound.

[[limitation]]
scenario = "set-isolated-between-clients"
mode = "transaction"
since = "2.9.13"
differs = [{ step = 7, pooler = { status = "ok", rows = [["9MB"]], tags = [0] } }]
doc = "https://github.com/supabase/supavisor/blob/b3c0236b57adcf29b4c026866a0456e28d5fd5c4/docs/migrating/pgbouncer.md?plain=1#L5-L6"
quote = "Both `transaction` and `session` pool mode behavior for Supavisor is the same as PgBouncer."
note = "Supavisor's docs say it behaves as PgBouncer. PgBouncer's feature map (https://github.com/pgbouncer/pgbouncer.github.io/blob/ccb120f859a47fe3a6f3b2120d16194fd11f562f/features.md#sql-feature-map-for-pooling-modes): \"SET/RESET | Yes | Never\", a row of its table \"SQL feature map for pooling modes\" (Feature, Session pooling, Transaction pooling) with padding collapsed."

