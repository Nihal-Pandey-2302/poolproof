name = "set-local-reverts-after-commit"
description = "SET LOCAL ... TO DEFAULT must not change the session value, outside or inside a transaction."
# pgdog#1770 fixed the case outside a transaction (steps 1-3). Inside a transaction that
# commits (steps 4-7), PgDog 0.1.62 still drops the session value.
refs = ["https://github.com/pgdogdev/pgdog/issues/1770"]

[[step]]
client = "a"
simple = "SET statement_timeout = '5s'"

[[step]]
client = "a"
simple = "SET LOCAL statement_timeout TO DEFAULT"

[[step]]
client = "a"
simple = "SHOW statement_timeout"

[[step]]
client = "a"
simple = "BEGIN"

[[step]]
client = "a"
simple = "SET LOCAL statement_timeout TO DEFAULT"

[[step]]
client = "a"
simple = "COMMIT"

[[step]]
client = "a"
simple = "SHOW statement_timeout"
