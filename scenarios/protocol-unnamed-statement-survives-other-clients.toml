name = "protocol-unnamed-statement-survives-other-clients"
description = "The unnamed statement stays usable until the same client replaces it, even if other clients ran queries."
# Counts only when b's queries ran on the server connection a parsed on, and a
# stayed on it: evidence around each, all the same. b's evidence queries replace
# the backend's unnamed statement, as b's own queries do: that is what this
# scenario is about, so they change nothing. a has no evidence between its Parse
# and Bind, where it would.
same_backend = [[2, 9], [5, 7], [7, 9]]

[[step]]
client = "a"
send = ["query SELECT 1"]

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
send = ["parse - SELECT 'from a'::text", "sync"]

[[step]]
client = "b"
send = ["query SELECT 0"]

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
send = ["query SELECT 1"]

[[step]]
client = "b"
evidence = true

[[step]]
client = "a"
send = ["bind - -", "execute -", "sync"]

[[step]]
client = "a"
evidence = true
