name = "load-isolated-between-clients"
description = "A library one client loads with LOAD must not show up for another client."
# LOAD needs a superuser. With auto_explain already preloaded or configured both sides
# see a value, so the scenario would pass without testing anything.
requires = ["superuser"]
setup = ["DO $$ BEGIN IF current_setting('auto_explain.log_min_duration', true) IS NOT NULL THEN RAISE 'auto_explain is already loaded or configured'; END IF; END $$"]
# Counts only when b really reached a's server connection. Each state step and the
# evidence before it share a transaction, so they run on one server connection.
same_backend = [[2, 7]]

[[step]]
client = "a"
simple = "BEGIN"

[[step]]
client = "a"
evidence = true

# auto_explain ships with Postgres and defines auto_explain.* settings once loaded.
[[step]]
client = "a"
simple = "LOAD 'auto_explain'"

[[step]]
client = "a"
simple = "COMMIT"

[[step]]
client = "a"
simple = "SELECT current_setting('auto_explain.log_min_duration', true) AS loaded_for_a"

[[step]]
client = "b"
simple = "BEGIN"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
simple = "SELECT current_setting('auto_explain.log_min_duration', true) AS loaded_for_b"

[[step]]
client = "b"
simple = "COMMIT"
