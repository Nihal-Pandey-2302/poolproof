name = "aborted-transaction-not-reused"
description = "A client that disconnects inside an aborted transaction must not pass it to the next client."
refs = ["https://github.com/pgbouncer/pgbouncer/issues/1415"]

# Counts when b got a's server connection, or when the pooler closed it instead.
same_backend_or_closed = [[2, 6]]

[[step]]
client = "a"
simple = "BEGIN"

# Inside the transaction, so it names the backend that ends up holding it aborted.
[[step]]
client = "a"
evidence = true

# The timeout aborts the transaction and the rest of the string, so COMMIT never runs.
[[step]]
client = "a"
simple = "SET LOCAL statement_timeout = 100; SELECT pg_sleep(1); COMMIT"

[[step]]
client = "a"
disconnect = true

[[step]]
client = "b"
simple = "SELECT 'b ok'::text"

[[step]]
client = "b"
evidence = true
