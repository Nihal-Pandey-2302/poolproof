name = "prepared-statement-survives-other-clients"
description = "A protocol-level prepared statement must still work after other clients used the pool."
# Counts only when b's query ran on the server connection a prepared on: evidence
# right before and after a's prepare and after b's query, and all three the same.
same_backend = [[2, 4], [4, 6]]

[[step]]
client = "a"
simple = "SELECT 1"

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
prepare = "SELECT 'from a'::text"
name = "q"

[[step]]
client = "a"
evidence = true

[[step]]
client = "b"
simple = "SELECT 1"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
disconnect = true

[[step]]
client = "a"
execute = "q"
