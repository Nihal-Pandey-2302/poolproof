name = "listen-notify-delivered"
description = "A client that ran LISTEN must receive NOTIFY messages sent by another client."
refs = ["https://github.com/pgbouncer/pgbouncer/issues/655"]
# Counts only when b really reached a's server connection. Each state step and the
# evidence before it share a transaction, so they run on one server connection.
same_backend = [[2, 6]]

[[step]]
client = "a"
simple = "BEGIN"

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
simple = "LISTEN pp_chan"

[[step]]
client = "a"
simple = "COMMIT"

[[step]]
client = "b"
simple = "BEGIN"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
simple = "NOTIFY pp_chan, 'hello'"

[[step]]
client = "b"
simple = "COMMIT"

[[step]]
client = "a"
notifications = true
