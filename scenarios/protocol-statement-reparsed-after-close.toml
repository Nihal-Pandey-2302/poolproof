name = "protocol-statement-reparsed-after-close"
description = "After Close, a statement name can be prepared again with different SQL, and the new SQL runs."
# Supavisor 2.10.0-rc.1 sometimes answers the re-Parse with 42P05 (a race, like the
# other statement-name races): run the pooler side several times.
repeat = 5
# Counts only when b's query ran on the server connection a prepared on: evidence
# right before and after a's Parse and after b's query, and all three the same.
same_backend = [[2, 4], [4, 6]]

[[step]]
client = "a"
send = ["query SELECT 1"]

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
send = ["parse s1 SELECT 'old'::text", "sync"]

[[step]]
client = "a"
evidence = true

[[step]]
client = "b"
send = ["query SELECT 1"]

[[step]]
client = "b"
evidence = true

[[step]]
client = "a"
send = ["close statement s1", "sync"]

[[step]]
client = "a"
send = ["parse s1 SELECT 'new'::text", "sync"]

[[step]]
client = "b"
send = ["query SELECT 2"]

[[step]]
client = "a"
send = ["bind - s1", "execute -", "sync"]
