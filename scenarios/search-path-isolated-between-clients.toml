name = "search-path-isolated-between-clients"
description = "A client's empty search_path must still be empty after another client changed it."
# Counts only when b's SET and a's SHOW ran on one server connection: evidence right
# before and after each, and all four the same.
same_backend = [[3, 5], [5, 6], [6, 8]]

# Empty is the value pg_dump sets. On Postgres 18 with more than one server connection,
# PgBouncer 1.26 replays it as `SET search_path=;` (pgbouncer#1663); the test bed is 17.
[[step]]
client = "a"
simple = "SET search_path = ''"

[[step]]
client = "b"
simple = "SELECT 1"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
simple = "SET search_path = public"

# b's evidence is also b's first query after its SET, which is what makes a pooler that
# applies SET lazily send it to the server.
[[step]]
client = "b"
evidence = true

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
simple = "SHOW search_path"

[[step]]
client = "a"
evidence = true
