name = "multi-statement-begin-not-first"
description = "A simple query with BEGIN after its first statement must run every statement, and a transaction it leaves open must stay open."
setup = ["DROP TABLE IF EXISTS pp_multi", "CREATE TABLE pp_multi (x int)"]
teardown = ["DROP TABLE IF EXISTS pp_multi"]

[[step]]
client = "app"
simple = "SELECT 1; BEGIN; INSERT INTO pp_multi VALUES (1); COMMIT"

[[step]]
client = "app"
simple = "SELECT count(*) FROM pp_multi; START TRANSACTION; INSERT INTO pp_multi VALUES (2); COMMIT"

[[step]]
client = "app"
simple = "SELECT 1; BEGIN; INSERT INTO pp_multi VALUES (3)"

[[step]]
client = "check"
direct = true
simple = "SELECT coalesce(array_agg(x ORDER BY x)::text, '{}') FROM pp_multi"

[[step]]
client = "other"
simple = "SELECT pg_current_xact_id_if_assigned() IS NULL AS own_transaction"
background = true

[[step]]
client = "app"
simple = "COMMIT"
delay_ms = 500

[[step]]
client = "other"
wait = true

[[step]]
client = "app"
disconnect = true

[[step]]
client = "check"
direct = true
simple = "SELECT coalesce(array_agg(x ORDER BY x)::text, '{}') FROM pp_multi"
