name = "deallocate-all-isolated"
description = "DEALLOCATE ALL from one client must not remove another client's prepared statements."
# Counts only when b's DEALLOCATE ALL ran on the server connection a prepared on and
# executes on. Each step and its evidence share a transaction, so they run on one.
same_backend = [[2, 6], [6, 10]]

[[step]]
client = "a"
simple = "BEGIN"

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
prepare = "SELECT 'from a'::text"
name = "q"

[[step]]
client = "a"
simple = "COMMIT"

[[step]]
client = "b"
simple = "BEGIN"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
simple = "DEALLOCATE ALL"

[[step]]
client = "b"
simple = "COMMIT"

[[step]]
client = "a"
simple = "BEGIN"

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
execute = "q"

[[step]]
client = "a"
simple = "COMMIT"
