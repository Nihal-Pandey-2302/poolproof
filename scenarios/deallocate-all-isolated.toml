name = "deallocate-all-isolated"
description = "DEALLOCATE ALL from one client must not remove another client's prepared statements."
# Counts only when b really reached a's server connection.
same_backend = [[3, 5]]

[[step]]
client = "a"
prepare = "SELECT 'from a'::text"
name = "q"

[[step]]
client = "b"
simple = "DEALLOCATE ALL"

[[step]]
client = "b"
evidence = true

[[step]]
client = "a"
execute = "q"

[[step]]
client = "a"
evidence = true
