name = "multi-statement-begin-left-open"
description = "BEGIN; ... without COMMIT in the same string must leave the transaction open on the client's server connection. Otherwise its statements are lost or run outside the transaction."
refs = ["https://github.com/pgdogdev/pgdog/issues/1849"]
setup = ["DROP TABLE IF EXISTS pp_multi", "CREATE TABLE pp_multi (x int)"]
teardown = ["DROP TABLE IF EXISTS pp_multi"]
# The second client must not run inside the open transaction (it gets its own, or waits).

[[step]]
client = "app"
simple = "BEGIN; INSERT INTO pp_multi VALUES (1)"

[[step]]
client = "check"
direct = true
simple = "SELECT coalesce(array_agg(x ORDER BY x)::text, '{}') FROM pp_multi"

[[step]]
client = "app"
simple = "SELECT count(*) FROM pp_multi"

[[step]]
client = "other"
simple = "SELECT pg_current_xact_id_if_assigned() IS NULL AS own_transaction"
background = true

[[step]]
client = "app"
simple = "COMMIT"
delay_ms = 500

[[step]]
client = "other"
wait = true

[[step]]
client = "app"
disconnect = true

[[step]]
client = "check"
direct = true
simple = "SELECT coalesce(array_agg(x ORDER BY x)::text, '{}') FROM pp_multi"
