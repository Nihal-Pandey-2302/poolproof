name = "cursor-isolated-between-clients"
description = "A WITH HOLD cursor declared by one client must not be visible to another client."
# Counts only when b really reached a's server connection.
same_backend = [[2, 4]]

[[step]]
client = "a"
simple = "DECLARE pp_cur CURSOR WITH HOLD FOR SELECT generate_series(1, 3)::text"

[[step]]
client = "a"
evidence = true

[[step]]
client = "b"
simple = "FETCH 1 FROM pp_cur"

[[step]]
client = "b"
evidence = true
