name = "set-role-isolated-between-clients"
description = "SET ROLE from one client must not change the role another client runs as."
requires = ["createrole"]
# Membership lets a user without superuser SET ROLE to it.
setup = ["DROP ROLE IF EXISTS pp_role", "CREATE ROLE pp_role", "GRANT pp_role TO CURRENT_USER"]
teardown = ["DROP ROLE IF EXISTS pp_role"]

[[step]]
client = "a"
simple = "SET ROLE pp_role"

[[step]]
client = "b"
simple = "SELECT current_user::text"
