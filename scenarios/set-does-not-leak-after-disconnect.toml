name = "set-does-not-leak-after-disconnect"
description = "Settings from a client that disconnected must not show up for the next client."
refs = ["https://github.com/pgdogdev/pgdog/issues/1850"]
# Counts when b's query ran on the server connection a left, or when the pooler closed
# it instead: evidence right before and after a's state step and b's query.
same_backend = [[2, 4], [7, 9]]
same_backend_or_closed = [[4, 7]]

[[step]]
client = "a"
simple = "SELECT 1"

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
simple = "SET work_mem = '7MB'"

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
disconnect = true

[[step]]
client = "b"
simple = "SELECT 1"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
simple = "SHOW work_mem"

[[step]]
client = "b"
evidence = true
