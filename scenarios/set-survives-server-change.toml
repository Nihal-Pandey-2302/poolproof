name = "set-survives-server-change"
description = "A session setting must stay in effect for its client while another client holds the server connection it was set on."
requires = ["several_server_connections"]
modes = ["transaction"]
# Whether the pooler hands c a's old backend can depend on timing: run it several times.
repeat = 5
setup = ["DROP TABLE IF EXISTS pp_hog_pid", "CREATE TABLE pp_hog_pid (who text PRIMARY KEY, pid int)"]
teardown = ["DROP TABLE IF EXISTS pp_hog_pid"]

[[step]]
client = "a"
simple = "SET work_mem = '7MB'"

# a's backend, so c can check it took it. This INSERT runs after a's SET as its own
# query: on a pool that doesn't hand a client back the connection it just released, the
# two can run on different backends, and the precondition then checks the wrong one. One
# string would rule that out, but PgDog refuses a query that mixes SET with other
# statements.
[[step]]
client = "a"
simple = "INSERT INTO pp_hog_pid VALUES ('a', pg_backend_pid()) ON CONFLICT (who) DO UPDATE SET pid = excluded.pid"

# c holds a's old backend in an open transaction, so a's next query has to run on
# another one. If c got a different backend, the run proves nothing and is a SKIP.
[[step]]
client = "c"
simple = "BEGIN"

[[step]]
client = "c"
simple = "SELECT pg_backend_pid() = (SELECT pid FROM pp_hog_pid WHERE who = 'a')"
precondition = true

[[step]]
client = "a"
simple = "SHOW work_mem"

[[step]]
client = "c"
simple = "COMMIT"

[[step]]
client = "a"
simple = "RESET work_mem"
