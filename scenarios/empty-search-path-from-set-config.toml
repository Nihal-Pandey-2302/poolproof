name = "empty-search-path-from-set-config"
description = "An empty search_path set with set_config() must survive another client changing it."
# pg_dump does this first thing. Postgres 18 reports search_path to the pooler, so
# poolers that track it have to restore the empty value correctly.
refs = ["https://github.com/pgbouncer/pgbouncer/issues/1663"]
# Counts only when b's SET and a's SHOW ran on one server connection: evidence right
# before and after each, and all four the same.
same_backend = [[3, 5], [5, 6], [6, 8]]

[[step]]
client = "a"
simple = "SELECT set_config('search_path', '', false)"

[[step]]
client = "b"
simple = "SELECT 1"

[[step]]
client = "b"
evidence = true

[[step]]
client = "b"
simple = "SET search_path = public"

# b's evidence is also b's first query after its SET, which is what makes a pooler that
# applies SET lazily send it to the server.
[[step]]
client = "b"
evidence = true

[[step]]
client = "a"
evidence = true

[[step]]
client = "a"
simple = "SHOW search_path"

[[step]]
client = "a"
evidence = true
