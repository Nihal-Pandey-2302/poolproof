# cargo deny check: run in CI on every push. Covers the root crate only.

[graph]
all-features = true

[advisories]
# Every vulnerability fails; unmaintained and unsound crates only fail when used directly.
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
# Licenses that can be combined with a MIT OR Apache-2.0 crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
