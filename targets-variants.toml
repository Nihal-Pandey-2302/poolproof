# Variant targets: non-default configs of the poolers in targets.toml. They need the
# variants profile: COMPOSE_PROFILES=variants docker compose -f docker/compose.yml up -d --wait
# Their results will go in results/variants-postgres-18.4.json, never in RESULTS.md.
# Names end in the config label, so they never clash with targets.toml.

# Session mode, pool of one server connection. Scenarios that need two connected
# clients at once can't run here and SKIP; the rest must match Postgres, since session
# mode keeps every client on its own server connection until it disconnects.

[[target]]
name = "pgbouncer-1.26.1-session"
product = "pgbouncer"
version = "1.26.1"
config = "session"
pooler = "postgres://postgres:postgres@127.0.0.1:56445/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "session"
reset = "all"

[[target]]
name = "pgdog-0.1.62-session"
product = "pgdog"
version = "0.1.62"
config = "session"
pooler = "postgres://postgres:postgres@127.0.0.1:56455/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "session"
reset = "all"

[[target]]
name = "supavisor-2.10.0-rc.1-session"
product = "supavisor"
version = "2.10.0-rc.1"
config = "session"
pooler = "postgres://postgres.ppsession:postgres@127.0.0.1:56463/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "session"
reset = "all"

# pool_size = 4, transaction mode. Pools open connections only when needed, so a lone
# client still stays on one; the *-survives-server-change scenarios make one client
# move. Scenarios that need a pool of one SKIP. PgBouncer and PgDog hold four (doctor
# --reset exact --pool-size 4: "held 4 transactions, client 5 waited"); Supavisor's pool
# holds pool_size + 1 (doctor --pool-size 5: "held 5 transactions, client 6 waited").

[[target]]
name = "pgbouncer-1.26.1-pool4"
product = "pgbouncer"
version = "1.26.1"
config = "pool4"
pooler = "postgres://postgres:postgres@127.0.0.1:56446/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "pgdog-0.1.62-pool4"
product = "pgdog"
version = "0.1.62"
config = "pool4"
pooler = "postgres://postgres:postgres@127.0.0.1:56456/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "supavisor-2.10.0-rc.1-pool4"
product = "supavisor"
version = "2.10.0-rc.1"
config = "pool4"
pooler = "postgres://postgres.pppool4:postgres@127.0.0.1:56462/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

# Settings real deployments change, in transaction mode with a pool of one. Each differs
# from its default target in targets.toml by that one setting:
# - noprep: max_prepared_statements = 0, protocol prepared statements not tracked (as
#   before PgBouncer 1.21, and in configs that set it to 0)
# - reset-always: server_reset_query_always = 1, DISCARD ALL after every transaction
# - full: prepared_statements = "full", PgDog also rewrites SQL PREPARE and EXECUTE.
#   It turns PgDog's query parser on, so this column also stands for parser-on setups
#   (sharding, read/write split): with the parser on and default prepared statements,
#   all 49 scenarios gave the same verdicts on PgDog 0.1.62. PgDog pins a client that
#   ran CREATE TEMP to its server connection (CHANGELOG v0.1.57; it needs the query
#   parser, so only this config does it). With a pool of one, the other client can't get
#   a server and PgDog answers 58000 "all replicas down"; with a bigger pool it gets
#   Postgres's own 42P01.
# - prepcache: prepared_statements_cache_size = 500, PgCat caches protocol statements
# - named-prepared: Supavisor's named_prepared_statements feature flag on (tenant
#   ppnamed); its FAQ says transaction mode needs it for named prepared statements

[[target]]
name = "pgbouncer-1.26.1-noprep"
product = "pgbouncer"
version = "1.26.1"
config = "noprep"
pooler = "postgres://postgres:postgres@127.0.0.1:56447/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "pgbouncer-1.26.1-reset-always"
product = "pgbouncer"
version = "1.26.1"
config = "reset-always"
pooler = "postgres://postgres:postgres@127.0.0.1:56448/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "pgdog-0.1.62-full"
product = "pgdog"
version = "0.1.62"
config = "full"
pooler = "postgres://postgres:postgres@127.0.0.1:56457/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "pgcat-1.2.0-prepcache"
product = "pgcat"
version = "1.2.0"
config = "prepcache"
pooler = "postgres://postgres:postgres@127.0.0.1:56482/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "supavisor-2.10.0-rc.1-named-prepared"
product = "supavisor"
version = "2.10.0-rc.1"
config = "named-prepared"
pooler = "postgres://postgres.ppnamed:postgres@127.0.0.1:56462/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"
