# Variant targets: non-default configs of the poolers in targets.toml. They need the
# variants profile: COMPOSE_PROFILES=variants docker compose -f docker/compose.yml up -d --wait
# Their results will go in results/variants-postgres-18.4.json, never in RESULTS.md.
# Names end in the config label, so they never clash with targets.toml.

# Session mode, pool of one server connection. Scenarios that need two connected
# clients at once can't run here and SKIP; the rest must match Postgres, since session
# mode keeps every client on its own server connection until it disconnects.

[[target]]
name = "pgbouncer-1.26.1-session"
product = "pgbouncer"
version = "1.26.1"
config = "session"
pooler = "postgres://postgres:postgres@127.0.0.1:56445/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "session"
reset = "all"

[[target]]
name = "pgdog-0.1.62-session"
product = "pgdog"
version = "0.1.62"
config = "session"
pooler = "postgres://postgres:postgres@127.0.0.1:56455/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "session"
reset = "all"

[[target]]
name = "supavisor-2.10.0-rc.1-session"
product = "supavisor"
version = "2.10.0-rc.1"
config = "session"
pooler = "postgres://postgres.ppsession:postgres@127.0.0.1:56463/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "session"
reset = "all"

# pool_size = 4, transaction mode. Pools open connections only when needed, so a lone
# client still stays on one; the *-survives-server-change scenarios make one client
# move. Scenarios that need a pool of one SKIP. PgBouncer and PgDog hold four (doctor
# --reset exact --pool-size 4: "held 4 transactions, client 5 waited"); Supavisor may
# open more than pool_size (there, client 5 got its own server connection).

[[target]]
name = "pgbouncer-1.26.1-pool4"
product = "pgbouncer"
version = "1.26.1"
config = "pool4"
pooler = "postgres://postgres:postgres@127.0.0.1:56446/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "pgdog-0.1.62-pool4"
product = "pgdog"
version = "0.1.62"
config = "pool4"
pooler = "postgres://postgres:postgres@127.0.0.1:56456/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

[[target]]
name = "supavisor-2.10.0-rc.1-pool4"
product = "supavisor"
version = "2.10.0-rc.1"
config = "pool4"
pooler = "postgres://postgres.pppool4:postgres@127.0.0.1:56462/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"
