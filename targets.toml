# Targets for the docker test bed (docker compose -f docker/compose.yml up -d --wait).
# Point these at your own pooler to test your setup.
#
# `reset` runs on `direct` before every run. Here it is "all": it terminates every other
# session on the database, so each scenario starts on fresh server connections, and
# waits up to 5s for each to exit (their locks and temp tables go away only then). The
# poolers share one Postgres, so "auto" (only the pooler's own sessions) would leave one
# pooler's leaks in place for the next. Only use "all" on a database nothing else uses.

[[target]]
name = "pgbouncer-1.24.1"
product = "pgbouncer"
version = "1.24.1"
config = "default"
pooler = "postgres://postgres:postgres@127.0.0.1:56441/app?sslmode=disable"
direct = "postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable"
mode = "transaction"
reset = "all"

