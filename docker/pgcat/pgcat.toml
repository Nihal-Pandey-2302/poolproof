# PgCat's defaults, except: transaction mode and a pool of one server connection.
# prepared_statements_cache_size is left at its default (0), so PgCat doesn't
# rewrite or cache protocol-level prepared statements.
[general]
host = "0.0.0.0"
port = 6432
admin_username = "admin"
admin_password = "admin"

[pools.app]
pool_mode = "transaction"

[pools.app.users.0]
username = "postgres"
password = "postgres"
pool_size = 1

[pools.app.shards.0]
servers = [["postgres", 5432, "primary"]]
database = "app"
