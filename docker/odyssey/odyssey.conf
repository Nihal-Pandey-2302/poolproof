# Odyssey's defaults, except: transaction mode and a pool of one server connection.
# pool_reserve_prepared_statement is left at its default, which is yes in 1.5.2
# (pool.c): Odyssey tracks protocol-level prepared statements and re-prepares them
# on whichever server connection a client gets. With it on, the default pool_discard
# becomes pool_smart_discard, which resets session state (RESET ALL, CLOSE ALL,
# UNLISTEN *, advisory locks, temp tables; not prepared statements) after every
# transaction. log_format has no default.
log_to_stdout yes
log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
	host "0.0.0.0"
	port 6432
}

storage "postgres" {
	type "remote"
	host "postgres"
	port 5432
}

database "app" {
	user "postgres" {
		authentication "scram-sha-256"
		password "postgres"
		storage "postgres"
		storage_user "postgres"
		storage_password "postgres"
		pool "transaction"
		pool_size 1
	}
}
