# Test bed: one Postgres with several pooler versions in front of it. Every pooler
# has a pool of ONE server connection, so state leaks between clients show up every
# time instead of by chance. POSTGRES_IMAGE picks the server (CI runs 17 and 18).
# Ports are published on 127.0.0.1 only. PP_PORT_<port> moves a host port, so several
# test beds can run side by side; scripts/testbed.sh sets them all from one offset.
name: poolproof

x-pgbouncer: &pgbouncer
  volumes:
    - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
  depends_on:
    postgres:
      condition: service_healthy

x-pgdog: &pgdog
  volumes:
    - ./pgdog/pgdog.toml:/pgdog/pgdog.toml:ro
    - ./pgdog/users.toml:/pgdog/users.toml:ro
  depends_on:
    postgres:
      condition: service_healthy

x-supavisor: &supavisor
  command: sh -c "/app/bin/migrate && /app/bin/server"
  # The entrypoint raises the open files limit to 100000 and exits if it can't.
  ulimits:
    nofile: 100000
  depends_on:
    postgres:
      condition: service_healthy
    supavisor-meta:
      condition: service_healthy

x-supavisor-env: &supavisor-env
  PORT: "4000"
  PROXY_PORT_SESSION: "5452"
  PROXY_PORT_TRANSACTION: "6543"
  CLUSTER_POSTGRES: "true"
  # Dev-only secrets, as in Supavisor's own docker-compose.yml.
  SECRET_KEY_BASE: "12345678901234567890121234567890123456789012345678903212345678901234567890123456789032123456789012345678901234567890323456789032"
  VAULT_ENC_KEY: "12345678901234567890123456789032"
  API_JWT_SECRET: dev
  METRICS_JWT_SECRET: dev
  REGION: local
  ERL_AFLAGS: -proto_dist inet_tcp

# One-shot: creates tenants (pool size 1, transaction mode) through the API.
# Clients connect as `postgres.<tenant>`.
x-supavisor-tenants: &supavisor-tenants
  image: curlimages/curl:8.22.0
  entrypoint: ["/add-tenant.sh"]
  volumes:
    - ./supavisor/add-tenant.sh:/add-tenant.sh:ro
    - ./supavisor/tenants:/tenants:ro
  healthcheck:
    test: ["CMD", "test", "-f", "/tmp/done"]
    interval: 1s
    retries: 180

services:
  # One-shot: the test CA and server certificate for the TLS targets.
  tls-certs:
    image: ${POSTGRES_IMAGE:-postgres:17.11}
    entrypoint: ["/make-certs.sh"]
    user: root
    volumes:
      - ./tls/make-certs.sh:/make-certs.sh:ro
      - tls:/certs
      - ./tls/out:/out

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11}
    # TLS for clients that ask (sslmode=disable targets don't).
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/postgres.key"]
    volumes:
      - tls:/tls:ro
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${PP_PORT_55432:-55432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app"]
      interval: 1s
      retries: 30

  pgbouncer-1.24.1:
    <<: *pgbouncer
    image: edoburu/pgbouncer:v1.24.1-p1
    ports: ["127.0.0.1:${PP_PORT_56441:-56441}:6432"]
  pgbouncer-1.25.2:
    <<: *pgbouncer
    image: edoburu/pgbouncer:v1.25.2-p0
    ports: ["127.0.0.1:${PP_PORT_56442:-56442}:6432"]
  pgbouncer-1.26.1:
    <<: *pgbouncer
    image: edoburu/pgbouncer:v1.26.1-p0
    ports: ["127.0.0.1:${PP_PORT_56443:-56443}:6432"]
  # Clients must connect with TLS.
  pgbouncer-1.26.1-tls:
    image: edoburu/pgbouncer:v1.26.1-p0
    ports: ["127.0.0.1:${PP_PORT_56444:-56444}:6432"]
    volumes:
      - ./pgbouncer/pgbouncer-tls.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - tls:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

  pgdog-0.1.50:
    <<: *pgdog
    image: ghcr.io/pgdogdev/pgdog:v0.1.50
    ports: ["127.0.0.1:${PP_PORT_56451:-56451}:6432"]
  pgdog-0.1.56:
    <<: *pgdog
    image: ghcr.io/pgdogdev/pgdog:v0.1.56
    ports: ["127.0.0.1:${PP_PORT_56452:-56452}:6432"]
  pgdog-0.1.62:
    <<: *pgdog
    image: ghcr.io/pgdogdev/pgdog:v0.1.62
    ports: ["127.0.0.1:${PP_PORT_56453:-56453}:6432"]
  pgdog-0.1.62-pubsub:
    <<: *pgdog
    image: ghcr.io/pgdogdev/pgdog:v0.1.62
    volumes:
      - ./pgdog/pgdog-pubsub.toml:/pgdog/pgdog.toml:ro
      - ./pgdog/users.toml:/pgdog/users.toml:ro
    ports: ["127.0.0.1:${PP_PORT_56454:-56454}:6432"]

  supavisor-meta:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supavisor/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "psql", "-U", "postgres", "-d", "supavisor_2_10", "-c", "SELECT 1"]
      interval: 1s
      retries: 30

  supavisor-2.9.13:
    <<: *supavisor
    image: supabase/supavisor:2.9.13
    environment:
      <<: *supavisor-env
      DATABASE_URL: ecto://postgres:postgres@supavisor-meta:5432/supavisor_2_9
    ports: ["127.0.0.1:${PP_PORT_56461:-56461}:6543"]
  supavisor-2.9.13-tenants:
    <<: *supavisor-tenants
    environment:
      SUPAVISOR: supavisor-2.9.13:4000
      TENANTS: pp:default.json
    depends_on: [supavisor-2.9.13]

  supavisor-2.10.0-rc.1:
    <<: *supavisor
    image: supabase/supavisor:2.10.0-rc.1
    environment:
      <<: *supavisor-env
      DATABASE_URL: ecto://postgres:postgres@supavisor-meta:5432/supavisor_2_10
    ports: ["127.0.0.1:${PP_PORT_56462:-56462}:6543"]
  supavisor-2.10.0-rc.1-tenants:
    <<: *supavisor-tenants
    environment:
      SUPAVISOR: supavisor-2.10.0-rc.1:4000
      TENANTS: pp:default.json ppstrict:strict.json
    depends_on: [supavisor-2.10.0-rc.1]

volumes:
  # The test CA and server keys (see tls/make-certs.sh).
  tls:
