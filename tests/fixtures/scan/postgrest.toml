# PostgREST (Supabase): request context set with set_config(..., true) per transaction.

[[query]]
sql = "select set_config('search_path', $1, true), set_config('role', $2, true), set_config('request.jwt.claims', $3, true), set_config('request.method', $4, true), set_config('request.path', $5, true), set_config('request.headers', $6, true), set_config('request.cookies', $7, true)"
form = "log"
expect = []
note = "every request; transaction-scoped, safe"

[[query]]
sql = 'select set_config($1, $2, $3), set_config($4, $5, $6), set_config($7, $8, $9), set_config($10, $11, $12), set_config($13, $14, $15), set_config($16, $17, $18), set_config($19, $20, $21)'
form = "pgss"
expect = ["session-set-config"]
pending = "C11"
note = "same, pg_stat_statements: is_local is a parameter, so scan can only say check the value"

[[query]]
sql = "WITH pgrst_source AS (SELECT \"public\".\"todos\".* FROM \"public\".\"todos\" WHERE \"public\".\"todos\".\"done\" = false) SELECT null::bigint AS total_result_set, pg_catalog.count(_postgrest_t) AS page_total, coalesce(json_agg(_postgrest_t), '[]') AS body FROM (SELECT * FROM pgrst_source) _postgrest_t"
form = "log"
expect = []
note = "GET /todos?done=eq.false"
