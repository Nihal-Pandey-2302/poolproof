name: drivers

# Real drivers through the newest version of each pooler (drivers/targets.txt). It takes
# about as long as one Postgres version of the suite, so it runs only when something it
# depends on changes, plus once a week. Postgres 17 only.
on:
  push:
    branches: [main]
    paths: &paths
      - drivers/**
      - src/drivers/**
      - src/runner/**
      - src/report/**
      - src/scenario.rs
      - src/cli.rs
      - build.rs
      - Cargo.lock
      - docker/**
      - targets.toml
      - results/drivers-*.json
      - .github/workflows/drivers.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: drivers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drivers:
    # Not on draft PRs, like the suite.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: postgres:17.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layers are cached in the Actions cache, one scope per driver (CACHE=gha in
      # drivers/docker-bake.hcl). A cold build of all four takes about 90 seconds.
      - name: Build driver images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE: gha
        with:
          source: .
          files: drivers/docker-bake.hcl
          load: true

      - name: Start test bed
        id: bed
        run: docker compose -f docker/compose.yml up -d --wait --wait-timeout 300

      - name: Run driver cases
        id: run
        run: |
          cargo build --release
          targets=$(awk 'NF && $1 !~ /^#/ { printf "--target %s ", $1 }' drivers/targets.txt)
          # Exit 1 means some case failed, which is expected; 2 means poolproof itself broke.
          set +e
          # shellcheck disable=SC2086 # one word per flag and name
          ./target/release/poolproof drivers --check-scenarios $targets --format json > drivers.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          ./target/release/poolproof report drivers.json >> "$GITHUB_STEP_SUMMARY"

      # Verdicts only, as in the suite job, skipping the pairs in results/known-flaky.txt.
      - name: Compare with committed results
        run: |
          flaky=$(awk '{ sub(/\r$/, "") } NF == 2 && $1 !~ /^#/ { print $1 " " $2 }' results/known-flaky.txt | jq -Rsc 'split("\n") | map(select(. != ""))')
          verdicts='.results[] | select("\(.target) \(.scenario)" as $k | $flaky | index($k) | not)
            | "\(.target) \(.scenario) \(.result) \(.mismatch.kind // "")"'
          compare() { jq -r --argjson flaky "$flaky" "$verdicts" "$1" | sort; }
          if ! diff <(compare results/drivers-postgres-17.11.json) <(compare drivers.json); then
            echo "::error::Driver verdicts changed. Run scripts/update-driver-results.sh and commit."
            exit 1
          fi

      - name: Cases are deterministic on Postgres
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: |
          jq -r '.results[] | select(.result == "error" and (.reason | startswith("nondeterministic scenario")))
                 | "::error::\(.scenario): \(.reason)"' drivers.json | sort -u | tee nondeterministic.txt
          if [ -s nondeterministic.txt ]; then exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drivers-postgres-17.11
          path: drivers.json

      - name: Pooler logs
        if: failure()
        run: docker compose -f docker/compose.yml logs
