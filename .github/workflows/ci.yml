name: ci

# Branches run through pull_request; push only for main, so a PR runs CI once.
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: undrafting a PR starts the suite it skipped as a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# On a PR, a newer commit cancels the older run: only the latest result matters for
# merging. Runs on main are never cancelled, so every main commit gets the suite, the
# results comparison and its Pages build; they queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs get read access only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # RESULTS.md must be what the committed results render to.
      - run: cargo run -q -- report results/postgres-*.json | diff RESULTS.md -
      # Same for DRIVERS.md and the drivers workflow's committed results.
      - run: cargo run -q -- report results/drivers-postgres-*.json | diff DRIVERS.md -

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  # rust-version in Cargo.toml must stay true.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets

  # The self-test proxies (tools/pp-proxy), a separate crate.
  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pp-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/pp-proxy
      # Its own rustfmt.toml, so the root fmt check doesn't cover it.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Harness self-test: the pp-proxy targets must get exactly selftest/expected.toml.
  # Passthrough must pass everything; each fault must break only its scenarios.
  selftest:
    needs: [test, tools]
    # About 4.5 minutes: skipped on draft PRs, like the suite.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            tools/pp-proxy

      - name: Start Postgres
        run: docker compose -f docker/compose.yml up -d --wait --wait-timeout 300 postgres

      - name: Build
        run: |
          cargo build
          (cd tools/pp-proxy && cargo build --locked)

      # Built here rather than in Docker: no Rust image pull, and rust-cache applies.
      # Same listeners as the pp-proxy service in docker/compose.yml, on the host ports.
      - name: Start the self-test proxies
        env:
          PROXY_UPSTREAM: 127.0.0.1:55432
          PROXY_USER: postgres
          PROXY_PASSWORD: postgres
          PROXY_DATABASE: app
          PROXY_LISTEN: 56471=none,56472=drop-pipelined,56473=swallow-error,56474=no-copydone,56475=wrong-tag,56476=shared-server,56477=refuse,56478=pool-of-two
        run: |
          nohup tools/pp-proxy/target/debug/pp-proxy > pp-proxy.log 2>&1 &
          echo $! > pp-proxy.pid
          for _ in $(seq 50); do (exec 3<>/dev/tcp/127.0.0.1/56478) 2>/dev/null && exit 0; sleep 0.1; done
          cat pp-proxy.log
          exit 1

      # pool-of-two has two server connections: doctor's exact reset must count both, and
      # must refuse a pool size of 1. Before the run, while no scenario has left state on
      # the proxy's connections (it never resets them).
      - name: Check doctor against pool-of-two
        run: |
          p='postgres://postgres:postgres@127.0.0.1:56478/app?sslmode=disable'
          d='postgres://postgres:postgres@127.0.0.1:55432/app?sslmode=disable'
          doctor() { ./target/debug/poolproof doctor --pooler "$p" --direct "$d" --mode transaction --reset exact --pool-size "$1" || true; }
          doctor 2 | tee doctor-2.txt
          grep -q 'exact: held 2 transactions, client 3 waited' doctor-2.txt
          doctor 1 | tee doctor-1.txt
          grep -q 'exact: pool_size = 1, but client 2 got its own server connection' doctor-1.txt

      - name: Run the self-test
        run: |
          # Exit 1 means some scenario failed, which is expected here; 2 means poolproof broke.
          set +e
          ./target/debug/poolproof run --targets selftest/targets.toml --format json > selftest.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          # A proxy that died mid-run fails here, not just through odd verdicts.
          kill -0 "$(cat pp-proxy.pid)" || { echo "pp-proxy died during the run"; cat pp-proxy.log; exit 1; }
          tools/pp-proxy/target/debug/pp-selftest-check selftest/expected.toml selftest.json scenarios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest
          path: selftest.json

      - name: Proxy log
        if: failure()
        run: cat pp-proxy.log

  # The action in action.yml, on a fresh build (binary:), since the download path needs a
  # release. Each case checks the exit code and the files the action reports.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build
      - run: printf 'SET search_path TO app;\nSELECT pg_advisory_lock(1);\n' > queries.sql

      - id: scan
        uses: ./
        continue-on-error: true
        with:
          binary: target/debug/poolproof
          command: scan
          args: queries.sql
          sarif: true
          upload-sarif: false
      - env:
          OUTCOME: ${{ steps.scan.outcome }}
          CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          [ "$OUTCOME" = failure ] && [ "$CODE" = 1 ]
          jq -e '.runs[0].results | length == 2' "$SARIF"

      # Arguments with spaces and quotes stay one argument each; nothing is expanded.
      - id: refused
        uses: ./
        continue-on-error: true
        with:
          binary: target/debug/poolproof
          command: run
          args: |
            --pooler
            postgres://postgres:x@127.0.0.1:1/app
            --direct
            postgres://postgres:x@127.0.0.1:1/app
            --filter
            advisory-lock $(touch pwned) "quoted"
      - env:
          OUTCOME: ${{ steps.refused.outcome }}
          CODE: ${{ steps.refused.outputs.exit-code }}
          REPORT: ${{ steps.refused.outputs.report }}
        run: |
          # The filter matches nothing: no scenario runs, so exit 0.
          [ "$OUTCOME" = success ] && [ "$CODE" = 0 ]
          [ ! -e pwned ]
          jq -e '.results == []' "$REPORT"

      - id: refused-all
        uses: ./
        continue-on-error: true
        with:
          binary: target/debug/poolproof
          command: run
          args: |
            --pooler
            postgres://postgres:x@127.0.0.1:1/app
            --direct
            postgres://postgres:x@127.0.0.1:1/app
      - env:
          CODE: ${{ steps.refused-all.outputs.exit-code }}
          REPORT: ${{ steps.refused-all.outputs.report }}
        run: |
          [ "$CODE" = 1 ]
          jq -e '.results | length > 0 and all(.result == "error")' "$REPORT"

      - id: bad-args
        uses: ./
        continue-on-error: true
        with:
          binary: target/debug/poolproof
          command: scan
          args: |
            --format
            json
            queries.sql
      - env:
          CODE: ${{ steps.bad-args.outputs.exit-code }}
        run: '[ "$CODE" = 2 ]'

      # Pinned by commit with no version: the install step stops before downloading.
      # GitHub sets the ref only for a remote action, so its script runs here directly.
      - name: A commit-pinned action needs version
        run: |
          yq '.runs.steps[0].run' action.yml > install.sh
          set +e
          ACTION_REF=$(printf '%040d' 0) INPUT_VERSION= INPUT_BINARY= \
            bash --noprofile --norc -eo pipefail install.sh > install.out 2>&1
          code=$?
          set -e
          cat install.out
          [ "$code" = 1 ] && grep -q 'pinned by commit' install.out

  # Advisories, licenses, banned crates and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

  # Every scenario against every pooler, once per Postgres version.
  suite:
    needs: test
    # Not on draft PRs: it takes 30-40 runner minutes. Pages depends on it, so it skips
    # too, and so do the Postgres-backed #[ignore] tests that run in this job.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17.11", "18.4"]
    env:
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Start test bed
        id: bed
        run: docker compose -f docker/compose.yml up -d --wait --wait-timeout 300

      - name: Run scenarios
        id: run
        run: |
          cargo build --release
          # Exit 1 means some scenario failed, which is expected; 2 means poolproof itself broke.
          # --check-scenarios runs each scenario twice on Postgres first: a scenario whose
          # results change between runs tests timing, not the pooler.
          set +e
          ./target/release/poolproof run --check-scenarios --format json > new.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          ./target/release/poolproof report new.json >> "$GITHUB_STEP_SUMMARY"

      # Only verdicts are compared, and not for timing-sensitive scenarios (repeat > 1),
      # whose worst case can differ between machines, or for the target and scenario pairs
      # in results/known-flaky.txt. Error text can depend on timing too.
      - name: Compare with committed results
        run: |
          # The timing list comes from this run, so a scenario that just got repeat > 1
          # is skipped on both sides before results/ is regenerated.
          timing=$(jq -c '[.scenarios[] | select(.repeat > 1) | .name]' new.json)
          # A malformed line would silently skip nothing, so it fails the step instead.
          # sub() drops a trailing \r, so a file saved with CRLF line ends still matches.
          awk '{ sub(/\r$/, "") }
               NF && $1 !~ /^#/ && NF != 2 { bad = 1
                 printf "::error file=%s,line=%d::expected \"<target> <scenario>\", got: %s\n", FILENAME, FNR, $0 }
               END { exit bad }' results/known-flaky.txt
          flaky=$(awk '{ sub(/\r$/, "") } NF == 2 && $1 !~ /^#/ { print $1 " " $2 }' results/known-flaky.txt | jq -Rsc 'split("\n") | map(select(. != ""))')
          if [ "$flaky" != "[]" ]; then
            { echo "### Not compared (results/known-flaky.txt)"; jq -r '.[] | "- \(.)"' <<<"$flaky"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          verdicts='.results[] | select(.scenario as $s | $timing | index($s) | not)
            | select("\(.target) \(.scenario)" as $k | $flaky | index($k) | not)
            | "\(.target) \(.scenario) \(.result) \(.mismatch.kind // "")"'
          compare() { jq -r --argjson timing "$timing" --argjson flaky "$flaky" "$verdicts" "$1" | sort; }
          if ! diff <(compare results/postgres-${{ matrix.postgres }}.json) <(compare new.json); then
            echo "::error::Verdicts changed on Postgres ${{ matrix.postgres }}. Run scripts/update-results.sh and commit."
            exit 1
          fi

      # The comparison above skips timing-sensitive and known-flaky pairs, and a scenario
      # added with its ERROR already committed would match too. So a scenario that isn't
      # deterministic on Postgres fails here on its own, even when the comparison failed.
      - name: Scenarios are deterministic on Postgres
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: |
          jq -r '.results[] | select(.result == "error" and (.reason | startswith("nondeterministic scenario")))
                 | "::error::\(.scenario): \(.reason)"' new.json | sort -u | tee nondeterministic.txt
          if [ -s nondeterministic.txt ]; then exit 1; fi

      # Tests marked #[ignore] need a real Postgres. They run after the scenarios so they
      # can't change a verdict, and even when the comparison failed. They get their own
      # database: the poolers may still hold locks and transactions that scenarios leaked
      # in `app`. --release reuses the dependencies built above.
      - name: Tests against Postgres
        if: ${{ !cancelled() && steps.bed.outcome == 'success' }}
        env:
          POOLPROOF_TEST_PG: postgres://postgres:postgres@127.0.0.1:55432/pp_test
        run: |
          docker compose -f docker/compose.yml exec -T postgres createdb -U postgres pp_test
          cargo test --release --locked -- --ignored

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-postgres-${{ matrix.postgres }}
          path: new.json

      - name: Pooler logs
        if: failure()
        run: docker compose -f docker/compose.yml logs

  # The results site, built from this run. Pages needs a public repo on free plans.
  pages:
    needs: suite
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-postgres-*
      - name: Build site
        run: |
          mkdir site
          cargo run -q --release -- report results-postgres-*/new.json --format html > site/index.html
          cp -r schemas site/schemas
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
