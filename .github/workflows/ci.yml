name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # RESULTS.md must be what the committed results render to.
      - run: cargo run -q -- report results/postgres-*.json | diff RESULTS.md -

  # Every scenario against every pooler, once per Postgres version.
  suite:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17.11", "18.4"]
    env:
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start test bed
        run: docker compose -f docker/compose.yml up -d --wait --wait-timeout 300

      - name: Run scenarios
        run: |
          cargo build --release
          # Exit 1 means some scenario failed, which is expected; 2 means poolproof itself broke.
          set +e
          ./target/release/poolproof run --format json > new.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          ./target/release/poolproof report new.json >> "$GITHUB_STEP_SUMMARY"

      # Only verdicts are compared. Error text in the details can depend on timing.
      - name: Compare with committed results
        run: |
          verdicts='.results[] | "\(.target) \(.scenario) \(.result) \(.mismatch.kind // "")"'
          if ! diff <(jq -r "$verdicts" results/postgres-${{ matrix.postgres }}.json | sort) \
                    <(jq -r "$verdicts" new.json | sort); then
            echo "::error::Verdicts changed on Postgres ${{ matrix.postgres }}. Run scripts/update-results.sh and commit."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: results-postgres-${{ matrix.postgres }}
          path: new.json

      - name: Pooler logs
        if: failure()
        run: docker compose -f docker/compose.yml logs

  # The results site, built from this run. Pages needs a public repo on free plans.
  pages:
    needs: suite
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: results-postgres-*
      - name: Build site
        run: |
          mkdir site
          cargo run -q --release -- report results-postgres-*/new.json --format html > site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
