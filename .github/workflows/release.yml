name: release

# Pushing a tag like v0.1.0 builds binaries (Linux, macOS, Windows), attests them and
# publishes a GitHub release (and the crate, once enabled; see docs/releasing.md).
# Running it by hand only builds, so the matrix can be checked without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs get read access only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # Shell completions and man pages, the same for every target. Made once on Linux,
  # since not every build job can run its own binary (x86_64 macOS on an arm64 runner).
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - run: cargo build --locked
      - name: Generate
        run: |
          pp=target/debug/poolproof
          mkdir -p extras/completions extras/man
          $pp completions bash > extras/completions/poolproof.bash
          $pp completions zsh > extras/completions/_poolproof
          $pp completions fish > extras/completions/poolproof.fish
          $pp completions powershell > extras/completions/_poolproof.ps1
          $pp completions elvish > extras/completions/poolproof.elv
          $pp man > extras/man/poolproof.1
          # One page per command the main page lists.
          for cmd in $($pp man | sed -n 's/^poolproof\\-\([a-z-]*\)(1)$/\1/p'); do
            [ "$cmd" = help ] && continue
            $pp man "$cmd" > "extras/man/poolproof-$cmd.1"
          done
          ls -R extras
          [ -s extras/man/poolproof-run.1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras
          path: extras

  build:
    needs: extras
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low enough for older distros.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extras
          path: extras
      - name: Package
        shell: bash
        run: |
          name=poolproof-${{ matrix.target }}
          exe=poolproof; [ "$RUNNER_OS" = Windows ] && exe=poolproof.exe
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$exe" README.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp -r extras/completions extras/man "$name"/
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./target/${{ matrix.target }}/release/poolproof list | grep multi-statement-begin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poolproof-${{ matrix.target }}
          path: poolproof-${{ matrix.target }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # Signed provenance: `gh attestation verify FILE --repo OWNER/poolproof` shows the
      # archive was built by this workflow from this tag.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            poolproof-*.tar.gz
            poolproof-*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum poolproof-*.tar.gz poolproof-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes poolproof-*.tar.gz poolproof-*.zip SHA256SUMS

  # crates.io through trusted publishing (OIDC), no stored token. Off until the owner sets
  # the repository variable CRATES_IO_TRUSTED_PUBLISHING to true; see docs/releasing.md.
  publish:
    if: startsWith(github.ref, 'refs/tags/') && vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - name: Tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
