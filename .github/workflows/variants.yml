name: variants

# The variant targets (targets-variants.toml: session mode, pools of four) on Postgres
# 18.4 only, compared with results/variants-postgres-18.4.json. Nightly, by hand, and on
# PRs that change what they run; not on every main push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scenarios/**"
      - "src/runner/**"
      - "docker/**"
      - "targets-variants.toml"
      - "results/variants-postgres-*.json"
      - ".github/workflows/variants.yml"

concurrency:
  group: variants-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  variants:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: postgres:18.4
      COMPOSE_PROFILES: variants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Start test bed
        run: docker compose -f docker/compose.yml up -d --wait --wait-timeout 300

      - name: Run scenarios
        id: run
        run: |
          cargo build --release
          # Exit 1 means some scenario failed, which is expected; 2 means poolproof itself broke.
          set +e
          ./target/release/poolproof run --targets targets-variants.toml --check-scenarios --format json > new.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          ./target/release/poolproof report new.json >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with committed results
        run: |
          set +e
          .github/compare-verdicts.sh results/variants-postgres-18.4.json new.json
          code=$?
          set -e
          if [ "$code" = 1 ]; then
            echo "::error::Variant verdicts changed. Run scripts/update-results.sh --variants and commit."
          fi
          exit "$code"

      - name: Scenarios are deterministic on Postgres
        if: ${{ !cancelled() && steps.run.outcome == 'success' }}
        run: |
          jq -r '.results[] | select(.result == "error" and (.reason | startswith("nondeterministic scenario")))
                 | "::error::\(.scenario): \(.reason)"' new.json | sort -u | tee nondeterministic.txt
          if [ -s nondeterministic.txt ]; then exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-variants-postgres-18.4
          path: new.json

      - name: Pooler logs
        if: failure()
        run: docker compose -f docker/compose.yml logs
