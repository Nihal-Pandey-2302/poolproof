version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # postgres-protocol's iterators implement fallible-iterator 0.2's trait, so a
      # newer major doesn't compile until postgres-protocol moves.
      - dependency-name: fallible-iterator
        update-types: ["version-update:semver-major"]
      # base64 comes in through postgres-protocol too; a newer major only duplicates it.
      - dependency-name: base64
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Postgres and pooler images are the test matrix: each version is pinned on purpose
  # and has committed results in results/. A bump would silently drop a tested version
  # and break the verdict comparison in CI. New versions are added by hand, next to the
  # old ones. Only helper images get updates here. Dependabot may name an image with or
  # without its registry (ghcr.io/pgdogdev/pgdog is reported as pgdogdev/pgdog), so
  # the patterns match any prefix.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*postgres"
      - dependency-name: "*pgbouncer"
      - dependency-name: "*pgdog"
      - dependency-name: "*supavisor"
      - dependency-name: "*pgcat"
      - dependency-name: "*odyssey"

  # The self-test proxy image (tools/pp-proxy/Dockerfile).
  - package-ecosystem: docker
    directory: /tools/pp-proxy
    schedule:
      interval: weekly
    groups:
      proxy-images:
        patterns: ["*"]

  # The driver programs (drivers/). Like the pooler images, each driver's version is part
  # of what is tested: drivers/drivers.toml and results/drivers-*.json name it, and a bump
  # would change the results without saying so. Drivers are bumped by hand (see
  # drivers/README.md). The rest gets one grouped PR a month, without major versions;
  # even that changes what runs, so the drivers workflow checks it against the results.
  - package-ecosystem: uv
    directory: /drivers/psycopg
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "psycopg*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      driver-psycopg:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /drivers/pgx
    schedule:
      interval: monthly
    ignore:
      # pgx and the packages it is made of (pgpassfile, pgservicefile, puddle).
      - dependency-name: "github.com/jackc/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      driver-pgx:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /drivers/node-postgres
    schedule:
      interval: monthly
    ignore:
      # pg and the packages it is made of (pg-protocol has the protocol code).
      - dependency-name: "pg"
      - dependency-name: "pg-*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      driver-node-postgres:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /drivers/pgjdbc
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "org.postgresql:postgresql"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      driver-pgjdbc:
        patterns: ["*"]

  # The drivers' base images. The language runtime is part of what is tested too, so only
  # a new digest or patch release of the same tag comes in (python 3.13 stays 3.13, and
  # the JDK that compiles pgjdbc's program stays the JRE's version); a new minor or major
  # is a change by hand, with regenerated results.
  - package-ecosystem: docker
    directories: ["/drivers/*"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      driver-images:
        patterns: ["*"]
