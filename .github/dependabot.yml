version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Postgres and pooler images are the test matrix: each version is pinned on purpose
  # and has committed results in results/. A bump would silently drop a tested version
  # and break the verdict comparison in CI. New versions are added by hand, next to the
  # old ones. Only helper images get updates here.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
      - dependency-name: edoburu/pgbouncer
      - dependency-name: ghcr.io/pgdogdev/pgdog
      - dependency-name: supabase/supavisor
